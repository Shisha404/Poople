<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель админа Poople</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <nav>
        <div><a href="../index.html">Главная</a></div>
        <ul>
            <li><a href="../pages/blog.html">Новости</a></li>
            <li><a href="../pages/products.html">Продукты</a></li>
            <li><a href="../pages/about.html">О компании</a></li>
            <li><a href="../pages/reviews.html">Отзывы</a></li>
            <li><a href="admin.html">Панель админа</a></li>
        </ul>
    </nav>

    <section class="hero-section">
        <div class="hero-title">Панель админа Poople</div>
    </section>

    <section class="admin-section">
        <h2>Добавить новый продукт</h2>
        <form id="product-form">
            <input type="text" name="name" placeholder="Название продукта" required>
            <textarea name="description" placeholder="Описание продукта" required></textarea>
            <input type="number" name="price" placeholder="Цена" required>
            <input type="url" name="image" placeholder="Ссылка на фото" required>
            <button class="button">Добавить</button>
        </form>

        <h2>Добавить новость</h2>
        <form id="news-form">
            <input type="text" name="title" placeholder="Заголовок новости" required>
            <textarea name="content" placeholder="Текст новости" required></textarea>
            <input type="date" name="date" required>
            <button class="button">Добавить</button>
        </form>

        <h2>Добавить отзыв</h2>
        <form id="review-form">
            <input type="text" name="author" placeholder="Имя автора" required>
            <textarea name="content" placeholder="Текст отзыва" required></textarea>
            <select name="rating" required>
                <option value="★★★★★">★★★★★</option>
                <option value="★★★★☆">★★★★☆</option>
                <option value="★★★☆☆">★★★☆☆</option>
                <option value="★★☆☆☆">★★☆☆☆</option>
                <option value="★☆☆☆☆">★☆☆☆☆</option>
            </select>
            <input type="date" name="date" required>
            <button class="button">Добавить</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2023 Poople. Все права защищены.</p>
    </footer>

    <script src="../script.js"></script>
</body>
</html>
